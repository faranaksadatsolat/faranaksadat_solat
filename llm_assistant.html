<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Smart Menu Vision — Overlay Translate (demo)</title>

<!-- OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/dist/tesseract.min.js"></script>

<style>
:root{
  --bg:#0b1020;--card:#111833;--ink:#ecf2ff;--muted:#9fb3ff;
  --accent:#6ee7b7;--accent2:#64d6ff;--line:rgba(255,255,255,.08);
}
*{box-sizing:border-box}
body{
  margin:0;padding:16px;background:linear-gradient(120deg,#0b1020,#151a33 40%,#0b1020);
  color:var(--ink);font-family:system-ui,ui-sans-serif,Roboto;
}
h1{text-align:center;font-size:22px;margin-bottom:4px}
.sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:16px}

.app{
  max-width:1120px;margin:0 auto;
  display:grid;grid-template-columns:1.1fr .9fr;gap:16px;
}
@media(max-width:950px){.app{grid-template-columns:1fr}}

.card{
  background:linear-gradient(180deg,#121a36 0%,#0e1630 100%);
  border:1px solid var(--line);border-radius:16px;
  padding:14px;box-shadow:0 8px 32px rgba(0,0,0,.25);
}
h2{margin:4px 0 10px;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{
  border:0;border-radius:12px;padding:10px 14px;
  background:linear-gradient(135deg,#6ee7b7,#64d6ff);
  color:#071021;font-weight:700;cursor:pointer;
}
button.secondary{background:#121a36;color:var(--ink);border:1px solid var(--line)}
select,input{background:#0b1430;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px}

.viewer{
  position:relative;
  width:100%;
  background:#0b1430;border:1px solid var(--line);border-radius:14px;
  min-height:300px;
}
#canvasBase, #canvasOverlay{
  width:100%;height:auto;display:block;
  border-radius:14px;
}
.thumbs{display:flex;gap:10px;overflow-x:auto;margin-top:8px}
.thumb{position:relative;flex:0 0 108px}
.thumb img{width:108px;height:86px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.thumb button{position:absolute;top:5px;right:5px;border-radius:50%;padding:3px 6px;background:#192148;color:#fff;border:1px solid var(--line)}

.pill{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px}
.out{
  background:#0b1430;border:1px solid var(--line);border-radius:12px;
  padding:12px;min-height:56px;font-size:14px;white-space:pre-wrap;
}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
.badge{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<h1>Smart Menu Vision — Overlay Translate</h1>
<div class="sub">Photo → OCR (ko/en) → inline EN on image → check allergens</div>

<div class="app">
  <!-- LEFT -->
  <section class="card">
    <h2>1) Capture / Upload</h2>
    <div class="row">
      <select id="cameraSelect"></select>
      <button id="startCam">Start Camera</button>
      <button id="stopCam" class="secondary">Stop</button>
      <label class="secondary" style="padding:9px 12px;cursor:pointer">
        Upload
        <input id="fileInput" type="file" accept="image/*" class="hidden">
      </label>
    </div>

    <div class="viewer">
      <canvas id="canvasBase"></canvas>
      <canvas id="canvasOverlay"></canvas>
    </div>

    <div class="row" style="margin-top:8px">
      <button id="captureBtn">📸 Use current frame</button>
      <button id="clearAll" class="secondary">Clear All</button>
      <span class="badge">Overlay is drawn right on image (like GTranslate).</span>
    </div>
    <div id="thumbs" class="thumbs"></div>

    <h2 style="margin-top:14px">2) OCR log (for you)</h2>
    <div id="ocrLog" class="out">No image yet.</div>
  </section>

  <!-- RIGHT -->
  <aside class="card">
    <h2>3) Buyer allergy profile</h2>
    <div class="row">
      <label class="pill"><input type="checkbox" class="allergen" value="milk"> Milk / 우유</label>
      <label class="pill"><input type="checkbox" class="allergen" value="soy"> Soy / 대두</label>
      <label class="pill"><input type="checkbox" class="allergen" value="nuts"> Nuts / 견과류</label>
      <label class="pill"><input type="checkbox" class="allergen" value="peanut"> Peanut / 땅콩</label>
      <label class="pill"><input type="checkbox" class="allergen" value="gluten"> Gluten / 글루텐</label>
      <label class="pill"><input type="checkbox" class="allergen" value="egg"> Egg / 계란</label>
      <label class="pill"><input type="checkbox" class="allergen" value="shellfish"> Shellfish</label>
    </div>

    <h2 style="margin-top:14px">4) Verdict</h2>
    <div id="verdict" class="out">No scan.</div>

    <div class="footer">© 2025 Faranaksadat Solat • SIIF 2025</div>
  </aside>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

const state = {
  stream:null,
  imageCapture:null,
  deviceId:null,
  lastText:'',
  textAllergens:new Set()
};

/* mini KR → EN (for overlay) */
const miniDict = {
  "정식":"set meal",
  "메뉴":"menu",
  "세트":"set",
  "닭":"chicken",
  "치킨":"chicken",
  "계란":"egg",
  "달걀":"egg",
  "우유":"milk",
  "치즈":"cheese",
  "새우":"shrimp",
  "해물":"seafood",
  "해산물":"seafood",
  "소고기":"beef",
  "돼지고기":"pork",
  "비빔밥":"bibimbap",
  "라면":"ramen",
  "국수":"noodle",
  "만두":"dumpling",
  "김치":"kimchi"
};
function toENtoken(token){
  for(const[k,v] of Object.entries(miniDict)){
    if(token.includes(k)) return v;
  }
  return token; // fallback: show original
}

/* camera */
async function listCameras(){
  const devs = await navigator.mediaDevices.enumerateDevices();
  const vids = devs.filter(d=>d.kind==='videoinput');
  const sel = $('#cameraSelect'); sel.innerHTML='';
  vids.forEach((d,i)=>{
    const o=document.createElement('option');
    o.value=d.deviceId;
    o.textContent=d.label||`Camera ${i+1}`;
    sel.appendChild(o);
  });
  if(!state.deviceId && vids[0]) state.deviceId = vids[0].deviceId;
  if(isMobile) sel.style.display='none';
}
async function startCamera(){
  try{
    if(state.stream) stopCamera();
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{
        deviceId: state.deviceId?{exact:state.deviceId}:undefined,
        facingMode:'environment',
        width:{ideal:1920}, height:{ideal:1080}
      }
    });
    state.stream = stream;
    let v = document.getElementById('video');
    if(!v){
      v=document.createElement('video');
      v.id='video';v.autoplay=true;v.playsInline=true;v.muted=true;v.style.display='none';
      document.body.appendChild(v);
    }
    v.srcObject = stream;
    const track=stream.getVideoTracks()[0];
    if('ImageCapture' in window) state.imageCapture=new ImageCapture(track);
  }catch(e){ alert('camera error: '+e.message); }
}
function stopCamera(){
  if(state.stream){ state.stream.getTracks().forEach(t=>t.stop()); state.stream=null; }
}
$('#startCam').onclick=startCamera;
$('#stopCam').onclick=stopCamera;
$('#cameraSelect').onchange=e=>{state.deviceId=e.target.value;startCamera();};

/* capture frame */
async function captureFrame(){
  const v = document.getElementById('video');
  if(!v || !v.videoWidth) return null;
  const c = document.getElementById('canvasBase');
  const ctx = c.getContext('2d');
  c.width = v.videoWidth; c.height = v.videoHeight;
  ctx.drawImage(v,0,0);
  drawOverlayClear();
  const dataURL = c.toDataURL('image/png',1.0);
  analyzeImageFromCanvas();
  addThumb(dataURL);
}
$('#captureBtn').onclick = captureFrame;

/* upload */
$('#fileInput').onchange = e=>{
  const f=e.target.files[0];
  if(!f) return;
  const u=URL.createObjectURL(f);
  const img=new Image();
  img.onload=()=>{
    const c=$('#canvasBase'); const ctx=c.getContext('2d');
    c.width=img.naturalWidth; c.height=img.naturalHeight;
    ctx.drawImage(img,0,0);
    drawOverlayClear();
    analyzeImageFromCanvas();
    addThumb(c.toDataURL('image/png'));
    URL.revokeObjectURL(u);
  };
  img.src=u;
};

function addThumb(dataURL){
  const box=$('#thumbs');
  const t=document.createElement('div'); t.className='thumb';
  t.innerHTML=`<img src="${dataURL}"><button>×</button>`;
  t.querySelector('button').onclick=()=>t.remove();
  box.appendChild(t);
}

/* clear */
$('#clearAll').onclick=()=>{
  const c=$('#canvasBase'); const ctx=c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  drawOverlayClear();
  $('#ocrLog').textContent='No image yet.';
  state.lastText=''; state.textAllergens=new Set();
  updateVerdict();
  $('#thumbs').innerHTML='';
};

/* overlay canvas */
function drawOverlayClear(){
  const b=$('#canvasBase');
  const o=$('#canvasOverlay');
  o.width=b.width; o.height=b.height;
  const ctx=o.getContext('2d');
  ctx.clearRect(0,0,o.width,o.height);
}

/* OCR + overlay draw */
async function analyzeImageFromCanvas(){
  const base = $('#canvasBase');
  if(!base.width) return;
  $('#ocrLog').textContent='Running OCR…';
  try{
    const {data} = await Tesseract.recognize(base,'eng+kor');
    state.lastText = data.text || '';
    $('#ocrLog').textContent = state.lastText.trim() || '(empty)';

    // draw overlay word-by-word
    drawOverlayFromTessData(data);

    // detect allergens
    state.textAllergens = detectAllergensFromText(state.lastText);
    updateVerdict();
  }catch(e){
    $('#ocrLog').textContent='OCR error: '+e.message;
  }
}

function drawOverlayFromTessData(data){
  const o = $('#canvasOverlay');
  const ctx = o.getContext('2d');
  ctx.clearRect(0,0,o.width,o.height);

  // scale because tess boxes are in image coords
  const scaleX = o.width / data.imageSize.width;
  const scaleY = o.height / data.imageSize.height;

  // go through words
  (data.words||[]).forEach(w=>{
    if(!w.text) return;
    const x = w.bbox.x0 * scaleX;
    const y = w.bbox.y0 * scaleY;
    const wdt = (w.bbox.x1 - w.bbox.x0) * scaleX;
    const hgt = (w.bbox.y1 - w.bbox.y0) * scaleY;

    const en = toENtoken(w.text.trim());

    // background
    ctx.fillStyle='rgba(6,10,18,0.75)';
    ctx.fillRect(x, y, wdt, hgt);

    // text
    ctx.fillStyle='#ecf2ff';
    ctx.font = Math.max(10, hgt-2) + 'px system-ui';
    ctx.textBaseline='top';
    ctx.fillText(en, x+2, y+1, wdt-4);
  });
}

/* allergen detection */
function detectAllergensFromText(text){
  const RX = {
    milk:/milk|우유/i,
    soy:/soy|대두/i,
    nuts:/almond|walnut|cashew|견과|호두|아몬드/i,
    peanut:/peanut|땅콩/i,
    gluten:/gluten|밀\b|소맥|wheat/i,
    egg:/egg|계란|난류|달걀/i,
    shellfish:/shellfish|shrimp|crab|lobster|조개|게|새우/i
  };
  const set=new Set();
  for(const[k,re] of Object.entries(RX)){
    if(re.test(text)) set.add(k);
  }
  return set;
}

/* verdict */
function updateVerdict(){
  const user = $$('.allergen:checked').map(x=>x.value);
  if(!state.lastText){
    $('#verdict').innerHTML = '<span class="pill">No scan.</span>';
    return;
  }
  const hit = [...state.textAllergens].some(a=>user.includes(a));
  if(hit){
    $('#verdict').innerHTML = '<span class="pill" style="background:rgba(255,107,107,.14);border-color:rgba(255,107,107,.38)">⛔ This image contains your allergen.</span>';
  }else{
    $('#verdict').innerHTML = '<span class="pill" style="background:rgba(110,231,183,.12);border-color:rgba(110,231,183,.35)">✅ No allergen signals in this image.</span>';
  }
}
$$('.allergen').forEach(cb=>cb.addEventListener('change',updateVerdict));

/* init */
(async()=>{
  if(navigator.mediaDevices?.getUserMedia){
    await listCameras();
  }
})();
</script>
</body>
</html>
