<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Smart Menu Vision — EN Overlay</title>

<!-- Tesseract -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/dist/tesseract.min.js"></script>

<style>
:root{
  --bg:#0b1020;--card:#111833;--ink:#ecf2ff;--muted:#9fb3ff;
  --accent:#6ee7b7;--accent2:#64d6ff;--line:rgba(255,255,255,.08);
}
*{box-sizing:border-box}
body{
  margin:0;padding:16px;
  background:linear-gradient(120deg,#0b1020,#151a33 40%,#0b1020);
  color:var(--ink);font-family:system-ui,ui-sans-serif,Roboto;
}
h1{text-align:center;font-size:22px;margin-bottom:4px}
.sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:16px}
.app{
  max-width:1120px;margin:0 auto;
  display:grid;grid-template-columns:1.05fr .95fr;gap:16px;
}
@media(max-width:900px){.app{grid-template-columns:1fr}}
.card{
  background:linear-gradient(180deg,#121a36 0%,#0e1630 100%);
  border:1px solid var(--line);border-radius:16px;
  padding:14px;box-shadow:0 8px 32px rgba(0,0,0,.25);
}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{
  border:0;border-radius:12px;padding:9px 14px;
  background:linear-gradient(135deg,#6ee7b7,#64d6ff);
  color:#071021;font-weight:700;cursor:pointer;
}
button.secondary{background:#121a36;color:var(--ink);border:1px solid var(--line)}
.viewer{position:relative;width:100%;background:#0b1430;border:1px solid var(--line);border-radius:14px;min-height:300px;margin-top:10px}
#canvasBase,#canvasOverlay{width:100%;border-radius:14px;display:block}
#video{
  width:120px;height:68px;object-fit:cover;
  border-radius:10px;border:1px solid var(--line);
  background:#000;
}
@media(max-width:600px){#video{display:none}}
.out{
  background:#0b1430;border:1px solid var(--line);border-radius:12px;
  padding:10px;min-height:60px;white-space:pre-wrap;
}
.pill{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
.badge{font-size:11px;color:var(--muted)}
.thumbs{display:flex;gap:10px;overflow-x:auto;margin-top:8px}
.thumb{position:relative;flex:0 0 108px}
.thumb img{width:108px;height:86px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.thumb button{position:absolute;top:5px;right:5px;border-radius:50%;padding:3px 6px;background:#192148;color:#fff;border:1px solid var(--line)}
</style>
</head>
<body>
<h1>Smart Menu Vision — EN Overlay</h1>
<div class="sub">Take / upload → OCR (ko+en) → draw English on picture → allergy check</div>

<div class="app">
  <!-- LEFT -->
  <section class="card">
    <h2>1) Capture / Upload</h2>
    <div class="row">
      <select id="cameraSelect" title="Camera"></select>
      <button id="startCam">Start Camera</button>
      <button id="stopCam" class="secondary">Stop</button>
      <label class="secondary" style="padding:8px 14px;cursor:pointer">
        Upload
        <input id="fileInput" type="file" accept="image/*" class="hidden" style="display:none">
      </label>
      <video id="video" autoplay playsinline muted></video>
    </div>

    <div class="viewer">
      <canvas id="canvasBase"></canvas>
      <canvas id="canvasOverlay"></canvas>
    </div>

    <div class="row" style="margin-top:8px">
      <button id="captureBtn">📸 Use current frame</button>
      <button id="clearAll" class="secondary">Clear</button>
      <span class="badge">OCR runs automatically.</span>
    </div>
    <div id="thumbs" class="thumbs"></div>

    <h2 style="margin-top:14px">2) OCR debug</h2>
    <div id="ocrLog" class="out">No image.</div>
  </section>

  <!-- RIGHT -->
  <aside class="card">
    <h2>3) Buyer allergy profile</h2>
    <div class="row">
      <label class="pill"><input type="checkbox" class="allergen" value="milk"> Milk / 우유</label>
      <label class="pill"><input type="checkbox" class="allergen" value="soy"> Soy / 대두</label>
      <label class="pill"><input type="checkbox" class="allergen" value="nuts"> Nuts / 견과류</label>
      <label class="pill"><input type="checkbox" class="allergen" value="peanut"> Peanut / 땅콩</label>
      <label class="pill"><input type="checkbox" class="allergen" value="gluten"> Gluten / 글루텐</label>
      <label class="pill"><input type="checkbox" class="allergen" value="egg"> Egg / 계란</label>
      <label class="pill"><input type="checkbox" class="allergen" value="shellfish"> Shellfish</label>
    </div>

    <h2 style="margin-top:14px">4) Verdict</h2>
    <div id="verdict" class="out">No scan yet.</div>

    <div class="footer">© 2025 Faranaksadat Solat • SIIF 2025</div>
  </aside>
</div>

<script>
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

const state={
  stream:null,
  deviceId:null,
  lastText:'',
  textAllergens:new Set()
};

/* mini KR → EN dict */
const miniDict={
  "정식":"set meal",
  "메뉴":"menu",
  "세트":"set",
  "계란":"egg",
  "달걀":"egg",
  "우유":"milk",
  "치즈":"cheese",
  "새우":"shrimp",
  "해물":"seafood",
  "해산물":"seafood",
  "소고기":"beef",
  "돼지고기":"pork",
  "비빔밥":"bibimbap",
  "라면":"ramen",
  "국수":"noodle",
  "만두":"dumpling",
  "김치":"kimchi"
};
function toENtoken(t){
  t=t.trim();
  for(const[k,v] of Object.entries(miniDict)){
    if(t.includes(k)) return v;
  }
  return t;
}

/* CAMERA */
async function listCameras(){
  try{
    const devs=await navigator.mediaDevices.enumerateDevices();
    const vids=devs.filter(d=>d.kind==="videoinput");
    const sel=$("#cameraSelect");
    sel.innerHTML="";
    vids.forEach((d,i)=>{
      const o=document.createElement("option");
      o.value=d.deviceId;
      o.textContent=d.label || `Camera ${i+1}`;
      sel.appendChild(o);
    });
    if(!state.deviceId && vids[0]) state.deviceId=vids[0].deviceId;
    if(isMobile) sel.style.display="none";
  }catch(e){
    console.warn("listCameras",e);
  }
}
async function startCamera(){
  // 1st try back camera
  const baseConstraints={
    audio:false,
    video:{
      width:{ideal:1920},height:{ideal:1080},
      facingMode:"environment"
    }
  };
  if(state.deviceId) baseConstraints.video.deviceId={exact:state.deviceId};
  try{
    const stream=await navigator.mediaDevices.getUserMedia(baseConstraints);
    attachStream(stream);
  }catch(e){
    // fallback no facingMode
    try{
      const stream2=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
      attachStream(stream2);
    }catch(err){
      alert("Camera error: "+err.message);
    }
  }
}
function attachStream(stream){
  state.stream=stream;
  const v=$("#video");
  v.srcObject=stream;
}
function stopCamera(){
  if(state.stream){
    state.stream.getTracks().forEach(t=>t.stop());
    state.stream=null;
  }
  $("#video").srcObject=null;
}

$("#startCam").onclick=startCamera;
$("#stopCam").onclick=stopCamera;
$("#cameraSelect").onchange=e=>{ state.deviceId=e.target.value; startCamera(); };

/* CAPTURE */
$("#captureBtn").onclick=async ()=>{
  const v=$("#video");
  if(!v.srcObject || !v.videoWidth){
    $("#ocrLog").textContent="No camera frame.";
    return;
  }
  const base=$("#canvasBase");
  base.width=v.videoWidth;
  base.height=v.videoHeight;
  const ctx=base.getContext("2d");
  ctx.drawImage(v,0,0);
  clearOverlay();
  runOCRfromCanvas();
  addThumb(base.toDataURL("image/png"));
};

/* UPLOAD */
$("#fileInput").onchange=e=>{
  const f=e.target.files[0];
  if(!f) return;
  const u=URL.createObjectURL(f);
  const img=new Image();
  img.onload=()=>{
    const base=$("#canvasBase");
    const ctx=base.getContext("2d");
    base.width=img.naturalWidth;
    base.height=img.naturalHeight;
    ctx.drawImage(img,0,0);
    clearOverlay();
    runOCRfromCanvas();
    addThumb(base.toDataURL("image/png"));
    URL.revokeObjectURL(u);
  };
  img.src=u;
};

function addThumb(dataURL){
  const box=$("#thumbs");
  const d=document.createElement("div");
  d.className="thumb";
  d.innerHTML=`<img src="${dataURL}"><button>×</button>`;
  d.querySelector("button").onclick=()=>d.remove();
  box.appendChild(d);
}

/* CLEAR */
$("#clearAll").onclick=()=>{
  const base=$("#canvasBase");
  base.getContext("2d").clearRect(0,0,base.width,base.height);
  clearOverlay();
  $("#ocrLog").textContent="No image.";
  state.lastText="";
  state.textAllergens=new Set();
  updateVerdict();
};

/* OVERLAY */
function clearOverlay(){
  const base=$("#canvasBase");
  const o=$("#canvasOverlay");
  o.width=base.width;
  o.height=base.height;
  o.getContext("2d").clearRect(0,0,o.width,o.height);
}

/* OCR from canvas */
async function runOCRfromCanvas(){
  const base=$("#canvasBase");
  if(!base.width){
    $("#ocrLog").textContent="No image in canvas.";
    return;
  }
  $("#ocrLog").textContent="Running OCR…";
  try{
    const {data}=await Tesseract.recognize(base,"eng+kor");
    if(!data){
      $("#ocrLog").textContent="OCR returned empty data.";
      return;
    }
    const text=(data.text||"").trim();
    state.lastText=text;
    $("#ocrLog").textContent=text || "(empty text)";

    drawOverlayFromData(data);
    state.textAllergens=detectAllergens(text);
    updateVerdict();
  }catch(e){
    console.error(e);
    $("#ocrLog").textContent="OCR error: "+e.message;
  }
}

/* SAFE overlay */
function drawOverlayFromData(data){
  const base=$("#canvasBase");
  const o=$("#canvasOverlay");
  const ctx=o.getContext("2d");
  ctx.clearRect(0,0,o.width,o.height);

  // if no words, stop
  const words = Array.isArray(data.words) ? data.words : [];
  if(!words.length) return;

  const imgW = (data.imageSize && data.imageSize.width) ? data.imageSize.width : (base.width||1);
  const imgH = (data.imageSize && data.imageSize.height) ? data.imageSize.height : (base.height||1);

  const scaleX = o.width / imgW;
  const scaleY = o.height / imgH;

  words.forEach(w=>{
    if(!w || !w.text || !w.bbox) return;
    const x0 = (w.bbox.x0 || 0) * scaleX;
    const y0 = (w.bbox.y0 || 0) * scaleY;
    const wdt = ((w.bbox.x1 || 0) - (w.bbox.x0 || 0)) * scaleX;
    const hgt = ((w.bbox.y1 || 0) - (w.bbox.y0 || 0)) * scaleY;
    if(wdt <= 0 || hgt <= 0) return;

    const en = toENtoken(w.text);

    ctx.fillStyle="rgba(5,10,18,.78)";
    ctx.fillRect(x0,y0,wdt,hgt);

    ctx.fillStyle="#ecf2ff";
    ctx.font = Math.max(10, hgt-2)+"px system-ui";
    ctx.textBaseline="top";
    ctx.fillText(en, x0+2, y0+1, wdt-4);
  });
}

/* allergen detection */
function detectAllergens(text){
  const RX = {
    milk:/milk|우유/i,
    soy:/soy|대두/i,
    nuts:/almond|walnut|cashew|견과|호두|아몬드|pistachio/i,
    peanut:/peanut|땅콩/i,
    gluten:/gluten|wheat|밀\b|소맥/i,
    egg:/egg|계란|난류|달걀/i,
    shellfish:/shellfish|shrimp|crab|lobster|새우|게|조개/i
  };
  const set=new Set();
  for(const[k,rx] of Object.entries(RX)){
    if(rx.test(text)) set.add(k);
  }
  return set;
}

/* verdict */
function updateVerdict(){
  const user = $$('.allergen:checked').map(x=>x.value);
  if(!state.lastText){
    $("#verdict").innerHTML='<span class="pill">No scan.</span>';
    return;
  }
  const hit = [...state.textAllergens].some(a=>user.includes(a));
  if(hit){
    $("#verdict").innerHTML='<span class="pill" style="background:rgba(255,107,107,.15);border-color:rgba(255,107,107,.4)">⛔ This image contains your allergen.</span>';
  }else{
    $("#verdict").innerHTML='<span class="pill" style="background:rgba(110,231,183,.12);border-color:rgba(110,231,183,.35)">✅ No allergen signals in this image.</span>';
  }
}
$$('.allergen').forEach(cb=>cb.addEventListener('change',updateVerdict));

/* INIT */
(async ()=>{
  if(navigator.mediaDevices?.getUserMedia){
    await listCameras();
  }
})();
</script>
</body>
</html>
