<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vision Allergy Checker — SIIF 2025</title>

<!-- OCR (helper) -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/dist/tesseract.min.js"></script>
<!-- Vision (browser, free) -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

<style>
:root{
  --bg:#0b1020;--card:#111833;--ink:#ecf2ff;--muted:#9fb3ff;
  --accent:#6ee7b7;--accent2:#64d6ff;--line:rgba(255,255,255,.08);
}
*{box-sizing:border-box}
body{
  margin:0;padding:16px;
  font-family:system-ui,ui-sans-serif,Roboto;
  background:linear-gradient(120deg,#0b1020,#151a33 40%,#0b1020);
  color:var(--ink);
}
h1{text-align:center;font-size:22px;margin-bottom:6px}
.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:16px}

.app{
  max-width:1120px;margin:0 auto;
  display:grid;grid-template-columns:1.1fr .9fr;gap:16px;
}
@media(max-width:950px){.app{grid-template-columns:1fr}}

.card{
  background:linear-gradient(180deg,#121a36 0%,#0e1630 100%);
  border:1px solid var(--line);border-radius:16px;
  padding:14px;box-shadow:0 8px 32px rgba(0,0,0,.25);
}
h2{margin:4px 0 10px;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{
  border:0;border-radius:12px;padding:10px 14px;
  background:linear-gradient(135deg,#6ee7b7,#64d6ff);
  color:#071021;font-weight:700;cursor:pointer;
}
button.secondary{background:#121a36;color:var(--ink);border:1px solid var(--line)}
input{
  background:#0b1430;color:var(--ink);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px
}
video,canvas,img{
  width:100%;max-height:360px;border-radius:12px;
  border:1px solid var(--line);background:#0b1430;object-fit:contain;
}
.thumbs{display:flex;gap:10px;overflow-x:auto;margin-top:8px}
.thumb{position:relative;flex:0 0 108px}
.thumb img{width:108px;height:86px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.thumb button{position:absolute;top:5px;right:5px;border-radius:50%;padding:3px 6px;background:#192148;color:#fff;border:1px solid var(--line)}

.out{
  background:#0b1430;border:1px solid var(--line);border-radius:12px;
  padding:12px;min-height:56px;font-size:14px;white-space:pre-wrap;
}
.pill{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px}
.ok{background:rgba(110,231,183,.12);border-color:rgba(110,231,183,.35)}
.no{background:rgba(255,107,107,.14);border-color:rgba(255,107,107,.38)}
.warn{background:rgba(255,209,102,.14);border-color:rgba(255,209,102,.38)}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
.badge{font-size:11px;color:var(--muted)}
.hidden{display:none!important}
</style>
</head>
<body>
<h1>Vision Allergy Checker</h1>
<div class="sub">Take / upload food or menu → vision + light OCR → compare with your allergy list</div>

<div class="app">
  <!-- LEFT -->
  <section class="card">
    <h2>1) Capture / Upload</h2>
    <div class="row">
      <select id="cameraSelect"></select>
      <button id="startCam">Start Camera</button>
      <button id="stopCam" class="secondary">Stop</button>
      <label class="secondary" style="padding:9px 12px;cursor:pointer">
        Upload
        <input id="fileInput" type="file" accept="image/*" multiple class="hidden">
      </label>
    </div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" hidden></canvas>

    <div class="row" style="margin-top:8px">
      <button id="useFrame">📸 Use current frame</button>
      <button id="clearAll" class="secondary">Clear All</button>
      <span class="badge">System will auto-run VISION on every image.</span>
    </div>
    <div id="thumbs" class="thumbs"></div>

    <h2 style="margin-top:14px">2) Result (auto)</h2>
    <div id="scanOut" class="out">No image yet.</div>
  </section>

  <!-- RIGHT -->
  <aside class="card">
    <h2>3) Buyer allergy profile</h2>
    <div class="row">
      <label class="pill"><input type="checkbox" class="allergen" value="milk"> Milk / 우유</label>
      <label class="pill"><input type="checkbox" class="allergen" value="soy"> Soy / 대두</label>
      <label class="pill"><input type="checkbox" class="allergen" value="nuts"> Nuts / 견과류</label>
      <label class="pill"><input type="checkbox" class="allergen" value="peanut"> Peanut / 땅콩</label>
      <label class="pill"><input type="checkbox" class="allergen" value="gluten"> Gluten / 글루텐</label>
      <label class="pill"><input type="checkbox" class="allergen" value="egg"> Egg / 계란</label>
      <label class="pill"><input type="checkbox" class="allergen" value="shellfish"> Shellfish</label>
    </div>

    <h2 style="margin-top:14px">4) Verdict</h2>
    <div id="verdict" class="out">No scan.</div>

    <div class="footer">© 2025 Faranaksadat Solat • SIIF 2025</div>
  </aside>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

const state = {
  stream:null,
  imageCapture:null,
  deviceId:null,
  coco:null,
  lastText:'',
  textAllergens:new Set(),
  visionAllergens:new Set()
};

/* ===== load vision model ===== */
(async function(){
  try{
    state.coco = await cocoSsd.load({base:'lite_mobilenet_v2'});
    console.log('vision ready');
  }catch(e){
    console.warn('vision load fail', e);
  }
})();

/* ===== camera ===== */
async function listCameras(){
  const devs = await navigator.mediaDevices.enumerateDevices();
  const vids = devs.filter(d=>d.kind==='videoinput');
  const sel = $('#cameraSelect'); sel.innerHTML='';
  vids.forEach((d,i)=>{
    const o=document.createElement('option');
    o.value=d.deviceId;
    o.textContent=d.label||`Camera ${i+1}`;
    sel.appendChild(o);
  });
  if(!state.deviceId && vids[0]) state.deviceId = vids[0].deviceId;
  if(isMobile) sel.style.display='none';
}
async function pickBack(){
  const devs = await navigator.mediaDevices.enumerateDevices();
  const vids = devs.filter(d=>d.kind==='videoinput');
  const back = vids.find(d=>/back|rear|environment/i.test(d.label));
  return back?back.deviceId:(vids[0]?.deviceId||null);
}
async function startCamera(){
  try{
    const dev = isMobile? await pickBack() : state.deviceId;
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{deviceId:dev?{exact:dev}:undefined,facingMode:'environment',width:{ideal:1920},height:{ideal:1080}}
    });
    state.stream=stream;
    $('#video').srcObject=stream;
    const track=stream.getVideoTracks()[0];
    if('ImageCapture'in window) state.imageCapture=new ImageCapture(track);
  }catch(e){alert('Camera error: '+e.message);}
}
function stopCamera(){
  if(state.stream){state.stream.getTracks().forEach(t=>t.stop());state.stream=null;}
  $('#video').srcObject=null;
}
$('#startCam').onclick=startCamera;
$('#stopCam').onclick=stopCamera;
$('#cameraSelect').onchange=e=>{state.deviceId=e.target.value;startCamera();};

/* ===== capture to thumb & analyze ===== */
async function captureFrame(){
  const v = $('#video');
  if(!v.videoWidth) return null;
  const c = $('#canvas'); const ctx=c.getContext('2d',{willReadFrequently:true});
  c.width=v.videoWidth; c.height=v.videoHeight;
  ctx.drawImage(v,0,0);
  return c.toDataURL('image/png',1.0);
}
function addThumbAndAnalyze(dataURL){
  const box=$('#thumbs');
  const t=document.createElement('div'); t.className='thumb';
  t.innerHTML=`<img src="${dataURL}"><button>×</button>`;
  t.querySelector('button').onclick=()=>{t.remove();};
  box.appendChild(t);
  analyzeImageDataURL(dataURL);
}
$('#useFrame').onclick=async()=>{
  const url = await captureFrame();
  if(url) addThumbAndAnalyze(url);
};
$('#fileInput').onchange=e=>{
  [...e.target.files].forEach(f=>{
    const u = URL.createObjectURL(f);
    const img = new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      c.width=img.naturalWidth; c.height=img.naturalHeight;
      c.getContext('2d').drawImage(img,0,0);
      const data = c.toDataURL('image/png');
      addThumbAndAnalyze(data);
      URL.revokeObjectURL(u);
    };
    img.src=u;
  });
};
$('#clearAll').onclick=()=>{
  $('#thumbs').innerHTML='';
  state.lastText='';
  state.textAllergens=new Set();
  state.visionAllergens=new Set();
  $('#scanOut').textContent='No image yet.';
  updateVerdict();
};

/* ===== text allergen detect ===== */
function detectAllergensFromText(text){
  const RX = {
    milk:/milk|우유|dairy/i,
    soy:/soy|대두/i,
    nuts:/almond|walnut|cashew|견과|호두/i,
    peanut:/peanut|땅콩/i,
    gluten:/gluten|밀\b|소맥/i,
    egg:/egg|계란|난류/i,
    shellfish:/shellfish|shrimp|crab|lobster|조개|게|새우/i
  };
  const set=new Set();
  for(const[k,re] of Object.entries(RX)){
    if(re.test(text)) set.add(k);
  }
  return set;
}

/* ===== vision → pseudo-allergy ===== */
function visionToAllergens(preds){
  const set = new Set();
  preds.forEach(p=>{
    const cls = p.class.toLowerCase();
    const score = p.score || 0;
    if(score < 0.45) return;
    // غذاهای مرسوم
    if(/pizza|cake|donut|hot dog|sandwich|burrito|banana|apple|orange|bowl/i.test(cls)){
      set.add('egg');      // ممکنه
      set.add('gluten');   // نان / خمیر
      set.add('milk');     // سس/خامه
    }
    if(/wine glass|cup|bottle/i.test(cls)){
      set.add('milk'); // نوشیدنی‌های شیری
    }
  });
  return set;
}

/* ===== analyze full image ===== */
async function analyzeImageDataURL(dataURL){
  $('#scanOut').textContent='Analyzing image (vision + small OCR)…';
  // make image
  const img = new Image();
  img.onload = async ()=>{
    // create canvas
    const tmp = document.createElement('canvas');
    tmp.width = img.naturalWidth; tmp.height = img.naturalHeight;
    const ctx = tmp.getContext('2d',{willReadFrequently:true});
    ctx.drawImage(img,0,0);

    // OCR (helper only)
    let txt='';
    try{
      const ocr = await Tesseract.recognize(tmp,'eng+kor');
      txt = (ocr.data.text||'').trim();
    }catch(e){}

    state.lastText = txt;
    state.textAllergens = detectAllergensFromText(txt);

    // VISION
    let visionFound = [];
    if(state.coco){
      const preds = await state.coco.detect(tmp);
      const ag = visionToAllergens(preds);
      state.visionAllergens = ag;
      visionFound = [...ag];

      // draw quick overlay in scanOut (text only)
      const shortPreds = preds
        .filter(p=>p.score>0.5)
        .map(p=>p.class + ' ' + Math.round(p.score*100)+'%')
        .slice(0,5)
        .join(' • ');
      let out='Vision objects: '+(shortPreds || '(none)')+'\n';
      if(txt){
        out += 'Text hints: ' + txt.split('\n').map(l=>l.trim()).filter(l=>l).slice(0,4).join(' · ');
      }else{
        out += 'Text hints: (none)';
      }
      $('#scanOut').textContent = out;
    } else {
      state.visionAllergens = new Set();
      let out='Vision model not ready.\n';
      out += txt? 'Text: '+txt : 'Text: (none)';
      $('#scanOut').textContent = out;
    }

    updateVerdict();
  };
  img.src = dataURL;
}

/* ===== verdict ===== */
function updateVerdict(){
  const userSel = $$('.allergen:checked').map(x=>x.value);
  const textAll = [...state.textAllergens];
  const visionAll = [...state.visionAllergens];

  if(!state.lastText && !visionAll.length){
    $('#verdict').innerHTML = '<span class="pill warn">⚠ No scan.</span>';
    return;
  }

  const textConflict = textAll.some(a=>userSel.includes(a));
  if(textConflict){
    $('#verdict').innerHTML = '<span class="pill no">⛔ Text on image contains your allergen.</span>';
    return;
  }

  const visionConflict = visionAll.some(a=>userSel.includes(a));
  if(visionConflict){
    $('#verdict').innerHTML = '<span class="pill warn">⚠ Vision thinks this food may contain your allergen.</span>';
    return;
  }

  if(userSel.length && !textAll.length && !visionAll.length){
    $('#verdict').innerHTML = '<span class="pill warn">⚠ Text clean, vision unsure. Please confirm.</span>';
    return;
  }

  $('#verdict').innerHTML = '<span class="pill ok">✅ No allergen signals in this image.</span>';
}
$$('.allergen').forEach(cb=>cb.addEventListener('change',updateVerdict));

/* ===== init ===== */
(async()=>{
  if(navigator.mediaDevices?.getUserMedia){
    await listCameras();
  }
  if(isMobile){
    startCamera();
  }
})();
</script>
</body>
</html>
