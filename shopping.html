<!DOCTYPE html>
<html lang="en">
<head>
  <!-- force redeploy -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LLM Shopping Assistant (FARANAKSADAT SOLAT)</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/dist/tesseract.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f9f9f9;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    h1 {
      font-size: 1.4rem;
      text-align: center;
    }
    video, canvas, img {
      width: 100%;
      max-height: 280px;
      border-radius: 10px;
      margin: 10px 0;
    }
    button {
      padding: 10px 15px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 10px;
    }
    button:hover {
      background: #388e3c;
    }
    .output {
      background: #eee;
      padding: 10px;
      border-radius: 6px;
      min-height: 40px;
      margin-bottom: 10px;
      white-space: pre-wrap;
    }
    .chat-input {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>LLM Shopping Assistant (Smart Demo)</h1>

    <video id="camera" autoplay playsinline></video>
    <button onclick="capturePhoto()">Capture Label</button>
    <canvas id="snapshot" style="display:none;"></canvas>
    <img id="capturedImage" style="display:none;" alt="Captured label"/>

    <button onclick="runOCR()">Run OCR</button>
    <div id="ocrResult" class="output">OCR Result will appear here...</div>

    <button onclick="runTranslation()">Translate</button>
    <div id="translationResult" class="output">Translation will appear here...</div>

    <input id="question" class="chat-input" placeholder="Ask a question about the product...">
    <button onclick="askLLM()">Ask</button>
    <div id="llmResponse" class="output">LLM response will appear here...</div>
  </div>

  <script>
    const video = document.getElementById("camera");
    const canvas = document.getElementById("snapshot");
    const image = document.getElementById("capturedImage");
    let lastOCRText = "";

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(stream => video.srcObject = stream)
      .catch(err => console.error("Camera error:", err));

    function capturePhoto() {
      const ctx = canvas.getContext("2d");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      const dataURL = canvas.toDataURL("image/png");
      image.src = dataURL;
      image.style.display = "block";
      alert("Image captured. You can now run OCR.");
    }

    function runOCR() {
      document.getElementById("ocrResult").innerText = "Running OCR...";
      Tesseract.recognize(canvas, 'eng+kor', { logger: m => console.log(m) })
        .then(({ data: { text } }) => {
          lastOCRText = text.trim();
          document.getElementById("ocrResult").innerText = lastOCRText || "No text detected.";
        });
    }

    function runTranslation() {
      const ocrText = lastOCRText.toLowerCase();
      let translation = "Translated (smart): ";

      if (!ocrText || ocrText.includes("no text")) {
        translation += "No OCR result to translate.";
      } else if (ocrText.includes("우유") || ocrText.includes("milk")) {
        translation += "Warning: Contains milk.";
      } else if (ocrText.includes("대두") || ocrText.includes("soy")) {
        translation += "Contains soy. May cause allergy.";
      } else if (ocrText.includes("한국") || ocrText.includes("made in korea")) {
        translation += "Product of Korea. Safe for most users.";
      } else {
        translation += "No specific allergens found.";
      }

      document.getElementById("translationResult").innerText = translation;
    }

    function askLLM() {
      const question = document.getElementById("question").value.toLowerCase();
      const ocrText = lastOCRText.toLowerCase();
      let response = "";

      if (!ocrText) {
        response = "Please run OCR first.";
      } else if (question.includes("how much") || question.includes("price") || question.includes("cost")) {
        const priceMatch = ocrText.match(/[₩w]?\s?[\d,]{3,5}/);
        if (priceMatch) {
          const cleanPrice = priceMatch[0].replace(/[^\d]/g, "");
          response = "Detected price: ₩" + cleanPrice;
        } else {
          response = "Price information not clearly detected.";
        }
      } else if (question.includes("should i buy") || question.includes("buy it") || question.includes("recommend")) {
        const dateMatch = ocrText.match(/\b(20[0-9]{6,8})\b/); // Match 8-digit date e.g., 20280114
        let safe = true;

        if (ocrText.includes("오염") || ocrText.includes("변색") || ocrText.includes("손상")) {
          response = "❌ No. Quality issue detected.";
          safe = false;
        } else if (dateMatch) {
          const exp = dateMatch[0];
          const year = parseInt(exp.slice(0, 4));
          const month = parseInt(exp.slice(4, 6)) - 1;
          const day = parseInt(exp.slice(6, 8));
          const expDate = new Date(year, month, day);
          const now = new Date();

          if (expDate < now) {
            response = "❌ No. Product is expired.";
            safe = false;
          } else {
            response = "✅ Yes. Product is within expiry.";
          }
        }

        if (!dateMatch && safe) {
          response = "🤔 Not enough info to confidently recommend this product.";
        }
      } else {
        response = "💡 Try asking 'How much is it?', 'Buy it?', or 'Any allergens?'.";
      }

      document.getElementById("llmResponse").innerText = response;
    }
  </script>
</body>
</html>
