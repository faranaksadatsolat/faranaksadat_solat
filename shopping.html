<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM Shopping Assistant</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/dist/tesseract.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: #f4f4f4;
      padding: 10px;
      max-width: 600px;
      margin: auto;
    }
    h2 {
      text-align: center;
    }
    button {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 10px 16px;
      margin: 10px 0;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.9;
    }
    textarea, input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    .box {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      box-shadow: 0 0 6px rgba(0,0,0,0.1);
    }
    video, canvas, img {
      width: 100%;
      max-width: 100%;
      border-radius: 8px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <h2>LLM Shopping Assistant</h2>

  <div class="box">
    <video id="video" autoplay playsinline></video>
    <button onclick="capture()">Capture Label</button>
    <canvas id="canvas" style="display:none;"></canvas>
    <img id="snapshot" src="">
  </div>

  <div class="box">
    <button onclick="runOCR()">Run OCR</button>
    <div id="ocrResult">OCR result will appear here...</div>
  </div>

  <div class="box">
    <button onclick="translate()">Translate</button>
    <div id="translation">Translation will appear here...</div>
  </div>

  <div class="box">
    <input type="text" id="question" placeholder="Ask a question about the product...">
    <button onclick="askLLM()">Ask</button>
    <div id="llmResponse">LLM response will appear here...</div>
  </div>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const snapshot = document.getElementById("snapshot");
    const ctx = canvas.getContext("2d");

    // Start camera
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(stream => {
        video.srcObject = stream;
      });

    // Capture image
    function capture() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = canvas.toDataURL("image/png");
      snapshot.src = imageData;
    }

    // Run OCR using Tesseract.js
    function runOCR() {
      document.getElementById("ocrResult").innerText = "Processing OCR...";
      Tesseract.recognize(canvas, 'eng')
        .then(({ data: { text } }) => {
          document.getElementById("ocrResult").innerText = text.trim() || "No text found.";
        })
        .catch(err => {
          document.getElementById("ocrResult").innerText = "Error running OCR.";
          console.error(err);
        });
    }

    // Translate (mock)
    function translate() {
      const text = document.getElementById("ocrResult").innerText;
      if (!text || text === "OCR result will appear here...") {
        document.getElementById("translation").innerText = "Please run OCR first.";
        return;
      }
      document.getElementById("translation").innerText = 
        "Translated: This product may contain allergens such as wheat, soy, or milk. Please check ingredients carefully.";
    }

    // Ask question (mock LLM)
    function askLLM() {
      const q = document.getElementById("question").value;
      if (!q.trim()) {
        document.getElementById("llmResponse").innerText = "Please enter a question.";
        return;
      }
      document.getElementById("llmResponse").innerText = 
        `Answer: Based on product information, ${q.toLowerCase().includes("safe") ? "it appears safe for most users, but check allergy info." : "please check the label carefully."}`;
    }
  </script>

</body>
</html>
