
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LLM Smart Shopping Assistant</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    .image-preview { max-width: 300px; }
    textarea { width: 90%; height: 100px; margin-top: 10px; }
    button { margin: 10px 0; padding: 10px; }
  </style>
</head>
<body>
  <h2>LLM Shopping Assistant</h2>
  <video id="camera" autoplay playsinline width="300"></video>
  <br>
  <button onclick="capture()">Capture Label</button>
  <canvas id="snapshot" width="300" height="200" style="display:none;"></canvas>
  <br>
  <img id="preview" class="image-preview"/><br>
  <button onclick="runOCR()">Run OCR</button>
  <textarea id="ocrText" placeholder="OCR Output..."></textarea><br>
  <button onclick="smartTranslate()">Translate</button>
  <div id="translationResult">Translated (smart): ...</div>
  <br>
  <input type="text" id="userQuestion" placeholder="Ask about this product...">
  <button onclick="smartQA()">Ask</button>
  <div id="answerResult">...</div>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <script>
    const video = document.getElementById('camera');
    const canvas = document.getElementById('snapshot');
    const context = canvas.getContext('2d');
    const preview = document.getElementById('preview');

    navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
      video.srcObject = stream;
    });

    function capture() {
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      const dataURL = canvas.toDataURL('image/png');
      preview.src = dataURL;
    }

    function runOCR() {
      Tesseract.recognize(preview.src, 'kor+eng', {
        logger: m => console.log(m)
      }).then(({ data: { text } }) => {
        document.getElementById('ocrText').value = text;
      });
    }

    function smartTranslate() {
      const text = document.getElementById('ocrText').value.toLowerCase();
      let result = "No specific allergens found.";
      if (text.includes("우유") || text.includes("milk")) {
        result = "Contains milk. May not be suitable for people with dairy allergies.";
      } else if (text.includes("대두") || text.includes("soy")) {
        result = "Contains soy. May not be suitable for people with soy allergies.";
      }
      document.getElementById('translationResult').innerText = "Translated (smart): " + result;
    }

    function smartQA() {
      const text = document.getElementById('ocrText').value.toLowerCase();
      const question = document.getElementById('userQuestion').value.toLowerCase();
      let response = "Unable to answer. Please check the label again.";
      if (question.includes("safe") || question.includes("danger")) {
        if (text.includes("우유") || text.includes("milk") || text.includes("대두") || text.includes("soy")) {
          response = "May not be safe for individuals with allergies.";
        } else {
          response = "No major allergens detected. Likely safe for most users.";
        }
      } else if (question.includes("price") || question.includes("how much") || question.includes("cost")) {
        const wonMatch = text.match(/₩[0-9,]+|\[0-9,]+|[0-9,]+원/);
        if (wonMatch) {
          response = "The price is " + wonMatch[0].replace(/\/, "₩");
        } else {
          response = "Price not clearly found on the label.";
        }
      }
      document.getElementById('answerResult').innerText = response;
    }
  </script>
</body>
</html>
