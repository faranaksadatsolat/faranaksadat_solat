<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LLM Shopping Assistant</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      font-size: 1.5em;
    }
    video, img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 10px 15px;
      margin: 5px 0;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
    .output {
      background: #eee;
      padding: 10px;
      border-radius: 5px;
      min-height: 40px;
      white-space: pre-wrap;
    }
    .input-area {
      display: flex;
      margin-top: 10px;
    }
    .input-area input {
      flex: 1;
      padding: 10px;
      border-radius: 5px 0 0 5px;
      border: 1px solid #ccc;
    }
    .input-area button {
      border-radius: 0 5px 5px 0;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>LLM Shopping Assistant</h1>
    <video id="camera" autoplay playsinline></video>
    <button onclick="capturePhoto()">Capture Label</button>
    <canvas id="snapshot" style="display:none;"></canvas>
    <img id="capturedImage" alt="Captured Image" style="display:none;"/>

    <button onclick="runOCR()">Run OCR</button>
    <div id="ocrResult" class="output">OCR output will appear here...</div>

    <button onclick="runTranslation()">Translate</button>
    <div id="translationResult" class="output">Translation will appear here...</div>

    <div class="input-area">
      <input id="question" placeholder="Ask something like 'Cost?' or 'Buy it?'">
      <button onclick="askLLM()">Ask</button>
    </div>
    <div id="llmResponse" class="output">LLM answer will appear here...</div>
  </div>

  <script>
    const video = document.getElementById("camera");
    const canvas = document.getElementById("snapshot");
    const img = document.getElementById("capturedImage");
    let lastOCRText = "";

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(stream => video.srcObject = stream)
      .catch(err => console.error("Camera error:", err));

    function capturePhoto() {
      const context = canvas.getContext("2d");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      context.drawImage(video, 0, 0);
      const dataURL = canvas.toDataURL("image/png");
      img.src = dataURL;
      img.style.display = "block";
    }

    function runOCR() {
      document.getElementById("ocrResult").innerText = "Processing OCR...";
      Tesseract.recognize(canvas, 'eng+kor', {
        logger: m => console.log(m)
      }).then(({ data: { text } }) => {
        lastOCRText = text.trim();
        document.getElementById("ocrResult").innerText = lastOCRText || "No text detected.";
      });
    }

    function runTranslation() {
      const text = lastOCRText.toLowerCase();
      let result = "Translated (smart): ";

      if (!text || text.includes("no text")) {
        result += "No OCR result to translate.";
      } else if (text.includes("milk") || text.includes("우유")) {
        result += "⚠️ Contains milk (possible allergen).";
      } else if (text.includes("soy") || text.includes("대두")) {
        result += "⚠️ Contains soy (possible allergen).";
      } else {
        result += "No specific allergens found.";
      }

      document.getElementById("translationResult").innerText = result;
    }

    function askLLM() {
      const question = document.getElementById("question").value.toLowerCase();
      const text = lastOCRText.toLowerCase();
      const responseBox = document.getElementById("llmResponse");

      if (!text) {
        responseBox.innerText = "Please run OCR first.";
        return;
      }

      if (question.includes("price") || question.includes("cost") || question.includes("how much")) {
        const match = text.match(/₩?\s?(\d{1,4})/);
        if (match) {
          responseBox.innerText = `Detected price: ${match[1]}`;
        } else {
          responseBox.innerText = "Price information not clearly detected.";
        }
        return;
      }

      if (question.includes("buy")) {
        const hasExpired = /20\d{2}[\.\-]?(0[1-9]|1[0-2])[\.\-]?(0[1-9]|[12]\d|3[01])/.test(text);
        const isMadeInKorea = text.includes("made in korea") || text.includes("한국");

        if (hasExpired) {
          responseBox.innerText = "❌ Do not buy: expiration date found.";
        } else if (isMadeInKorea) {
          responseBox.innerText = "✅ Product is made in Korea. Likely good quality.";
        } else {
          responseBox.innerText = "🤔 Not enough info to confidently recommend this product.";
        }
        return;
      }

      responseBox.innerText = "I couldn't understand the question clearly.";
    }
  </script>
</body>
</html>
