<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LLM Shopping Assistant</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 20px; }
    img { max-width: 300px; margin-top: 10px; }
    textarea, input, button { margin-top: 10px; display: block; width: 90%; margin-left: auto; margin-right: auto; }
  </style>
</head>
<body>
  <h2>Product Label Scanner</h2>
  <video id="camera" width="300" autoplay></video>
  <button id="capture">📸 Capture Label</button>
  <canvas id="canvas" style="display:none;"></canvas>
  <img id="capturedImg" />
  
  <button id="runOCR">Run OCR</button>
  <textarea id="ocrOutput" rows="10" readonly></textarea>

  <button onclick="translateText()">Translate</button>
  <p id="translatedResult"></p>

  <input id="question" placeholder="Ask a question... e.g., Cost? Buy it?" />
  <button onclick="askQuestion()">Ask</button>
  <p id="answer"></p>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@2.1.4/dist/tesseract.min.js"></script>
  <script>
    const video = document.getElementById('camera');
    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');
    const capturedImg = document.getElementById('capturedImg');
    const ocrOutput = document.getElementById('ocrOutput');

    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => video.srcObject = stream);

    document.getElementById('capture').onclick = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      capturedImg.src = canvas.toDataURL('image/png');
    };

    document.getElementById('runOCR').onclick = async () => {
      ocrOutput.value = "Detecting...";
      const result = await Tesseract.recognize(capturedImg.src, 'eng+kor', { logger: m => console.log(m) });
      ocrOutput.value = result.data.text;
    };

    function translateText() {
      const text = ocrOutput.value;
      if (text.includes("알레르기") || text.includes("allergy")) {
        document.getElementById('translatedResult').innerText = "⚠️ Possible allergen warning.";
      } else {
        document.getElementById('translatedResult').innerText = "Translated (smart): No specific allergens found.";
      }
    }

    function askQuestion() {
      const text = ocrOutput.value;
      const q = document.getElementById('question').value.trim().toLowerCase();
      let answer = "🤔 Not enough info to confidently recommend this product.";

      if (q.includes("price") || q.includes("cost") || q.includes("how much")) {
        const priceMatch = text.match(/[₩wW] ?[0-9]{1,4}/);
        if (priceMatch) {
          answer = `Detected price: ${priceMatch[0].replace(/[^\d]/g, "")}`;
        } else {
          answer = "Price information not clearly detected.";
        }
      }

      else if (q.includes("buy")) {
        const expireMatch = text.match(/\b(20[0-9]{2}[01][0-9][0-3][0-9])\b/); // YYYYMMDD format
        const now = new Date();
        let isExpired = false;

        if (expireMatch) {
          const exp = expireMatch[0];
          const year = parseInt(exp.substring(0, 4));
          const month = parseInt(exp.substring(4, 6)) - 1;
          const day = parseInt(exp.substring(6, 8));
          const expDate = new Date(year, month, day);
          isExpired = expDate < now;
        }

        if (isExpired) {
          answer = "❌ No. Product is expired.";
        } else if (text.includes("오염") || text.includes("변색")) {
          answer = "❌ No. Possible quality issue found.";
        } else if (expireMatch) {
          answer = "✅ Yes. Product is within expiry.";
        } else {
          answer = "🤔 Not enough info to confirm product status.";
        }
      }

      document.getElementById("answer").innerText = answer;
    }
  </script>
</body>
</html>
