<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Offline LLM Shopping Assistant</title>
  <script src="https://mlc.ai/web-llm/dist/web-llm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f5f5f5; }
    .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px #ccc; }
    video, canvas, img { width: 100%; border-radius: 10px; margin-bottom: 10px; }
    .output { background: #eee; padding: 10px; border-radius: 6px; white-space: pre-wrap; min-height: 40px; margin-bottom: 10px; }
    input, button { width: 100%; padding: 10px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #ccc; }
    button { background: #4CAF50; color: white; border: none; }
    button:hover { background: #388e3c; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Offline LLM Shopping Assistant</h2>
    <video id="camera" autoplay playsinline></video>
    <button onclick="capturePhoto()">Capture Label</button>
    <canvas id="snapshot" style="display:none;"></canvas>
    <img id="capturedImage" style="display:none;" />

    <button onclick="runOCR()">Run OCR</button>
    <div id="ocrResult" class="output">OCR result...</div>

    <input id="question" placeholder="Ask: Should I buy it?">
    <button onclick="askLocalLLM()">Ask LLM (Offline)</button>
    <div id="llmResponse" class="output">LLM answer...</div>
  </div>

  <script>
    const video = document.getElementById("camera");
    const canvas = document.getElementById("snapshot");
    const image = document.getElementById("capturedImage");
    let lastOCRText = "";
    let chat;

    // Setup camera
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(stream => video.srcObject = stream)
      .catch(err => alert("Camera error: " + err));

    function capturePhoto() {
      const ctx = canvas.getContext("2d");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      image.src = canvas.toDataURL("image/png");
      image.style.display = "block";
    }

    function runOCR() {
      document.getElementById("ocrResult").innerText = "Running OCR...";
      Tesseract.recognize(canvas, 'eng+kor', { logger: m => console.log(m) })
        .then(({ data: { text } }) => {
          lastOCRText = text.trim();
          document.getElementById("ocrResult").innerText = lastOCRText || "No text detected.";
        });
    }

    async function askLocalLLM() {
      const question = document.getElementById("question").value;
      const inputText = `Label:\n${lastOCRText}\n\nQ: ${question}\nA:`;

      document.getElementById("llmResponse").innerText = "Thinking...";

      if (!chat) {
        chat = await webllm.CreateChatModule();
        await chat.reload("phi-2-q4f16_1");
      }

      await chat.resetChat();
      await chat.generate(inputText, (step, message) => {
        document.getElementById("llmResponse").innerText = message;
      });
    }
  </script>
</body>
</html>
