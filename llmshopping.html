<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LLM Shopping Assistant (Free GPT)</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f9f9f9;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      font-size: 1.3rem;
    }
    video, canvas, img {
      width: 100%;
      max-height: 300px;
      margin-bottom: 10px;
      border-radius: 10px;
    }
    button {
      padding: 10px 15px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .output {
      background: #eee;
      padding: 10px;
      border-radius: 6px;
      white-space: pre-wrap;
      min-height: 40px;
    }
    input.chat-input {
      width: 100%;
      padding: 10px;
      border: 1px solid #aaa;
      border-radius: 6px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>LLM Shopping Assistant</h1>

  <video id="camera" autoplay playsinline></video>
  <button onclick="capturePhoto()">Capture Label</button>
  <canvas id="snapshot" style="display:none;"></canvas>
  <img id="capturedImage" alt="Captured" style="display:none;" />

  <button onclick="runOCR()">Run OCR</button>
  <div id="ocrResult" class="output">OCR result will appear here...</div>

  <button onclick="runTranslation()">Translate</button>
  <div id="translationResult" class="output">Translation will appear here...</div>

  <input id="question" class="chat-input" placeholder="Ask: 'Should I buy it?', 'How much?', 'Is it expired?'">
  <button onclick="askLLM()">Ask</button>
  <div id="llmResponse" class="output">Answer will appear here...</div>
</div>

<script>
  const video = document.getElementById("camera");
  const canvas = document.getElementById("snapshot");
  const image = document.getElementById("capturedImage");
  const hfToken = "YOUR_HF_API_TOKEN"; // Replace this with your Hugging Face token
  let lastOCRText = "";

  // Start camera
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
    .then(stream => video.srcObject = stream)
    .catch(err => alert("Camera access error: " + err));

  function capturePhoto() {
    const ctx = canvas.getContext("2d");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);
    image.src = canvas.toDataURL("image/png");
    image.style.display = "block";
  }

  function runOCR() {
    document.getElementById("ocrResult").innerText = "Running OCR...";
    Tesseract.recognize(canvas, 'eng+kor', { logger: m => console.log(m) })
      .then(({ data: { text } }) => {
        lastOCRText = text.trim();
        document.getElementById("ocrResult").innerText = lastOCRText || "No text detected.";
      });
  }

  function runTranslation() {
    const text = lastOCRText.toLowerCase();
    let result = "Translated (smart): ";

    if (text.includes("milk") || text.includes("우유")) {
      result += "Warning: Contains milk.";
    } else if (text.includes("soy") || text.includes("대두")) {
      result += "Contains soy. Allergy risk.";
    } else if (text.includes("korea") || text.includes("한국")) {
      result += "Product of Korea.";
    } else {
      result += "No specific allergens found.";
    }

    document.getElementById("translationResult").innerText = result;
  }

  async function askLLM() {
    const question = document.getElementById("question").value;
    const fullPrompt = `Product label: """\n${lastOCRText}\n"""\nQuestion: ${question}\nAnswer:`;

    document.getElementById("llmResponse").innerText = "Thinking...";

    const response = await fetch("https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.1", {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${hfToken}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        inputs: fullPrompt,
        parameters: {
          max_new_tokens: 100,
          temperature: 0.5
        }
      })
    });

    const result = await response.json();
    const answer = result?.[0]?.generated_text?.split("Answer:")[1]?.trim() || "⚠️ Could not generate a response.";

    document.getElementById("llmResponse").innerText = answer;
  }
</script>
</body>
</html>
