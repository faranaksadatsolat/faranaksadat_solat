<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LLM Shopping Assistant — SIIF 2025</title>

<!-- Tesseract.js (OCR, free, on-device) -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/dist/tesseract.min.js"></script>

<!-- WebLLM (TinyLlama - HuggingFace local model) -->
<script src="https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.48/dist/web-llm.min.js"></script>

<style>
:root{
  --bg:#0b1020;--card:#111833;--ink:#ecf2ff;--muted:#9fb3ff;
  --accent:#6ee7b7;--accent2:#a78bfa;--line:rgba(255,255,255,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:linear-gradient(120deg,#0b1020,#151a33 40%,#0b1020);
  color:var(--ink);
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans";
}
.wrap{max-width:1160px;margin:0 auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
h1{margin:0;font-size:20px}
.card{background:#111833;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{
  border:0;border-radius:12px;padding:10px 14px;
  background:linear-gradient(135deg,#6ee7b7,#64d6ff);
  color:#071021;font-weight:700;cursor:pointer;
  box-shadow:0 10px 28px rgba(100,214,255,.25)
}
button.secondary{background:#121a36;color:var(--ink);box-shadow:none;border:1px solid var(--line)}
select,input{background:#0b1430;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
video,img{width:100%;max-height:360px;border-radius:12px;background:#0b1430;object-fit:contain}
.thumbs{display:flex;gap:10px;overflow:auto;padding:2px}
.thumb{position:relative;flex:0 0 108px}
.thumb img{width:108px;height:86px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.thumb button{position:absolute;top:6px;right:6px;border-radius:50%;padding:4px 7px;background:#192148;color:#fff;border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px;font-size:13px}
.kv div:nth-child(odd){color:var(--muted)}
.out{white-space:pre-wrap;background:#0b1430;border:1px solid var(--line);border-radius:12px;padding:12px;min-height:54px}
.pill{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px}
.ok{background:rgba(110,231,183,.14);border-color:rgba(110,231,183,.35)}
.no{background:rgba(255,107,107,.14);border-color:rgba(255,107,107,.35)}
.warn{background:rgba(255,209,102,.14);border-color:rgba(255,209,102,.35)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"></div>
    <h1>LLM Shopping Assistant — SIIF 2025 (EN+KR)</h1>
  </header>

  <div class="card">
    <h2>1) Capture label</h2>
    <div class="row">
      <button id="startCam">Start Camera</button>
      <button id="addView">📸 Add View</button>
      <button id="clearAll" class="secondary">Clear All</button>
      <label class="pill">Upload <input id="fileInput" type="file" accept="image/*" multiple style="display:none"></label>
    </div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" hidden></canvas>
    <div class="thumbs" id="thumbs"></div>

    <h2>2) OCR all views</h2>
    <div class="row">
      <select id="lang">
        <option value="eng+kor" selected>English + Korean</option>
      </select>
      <button id="runAll">Run OCR</button>
    </div>

    <h2>3) Ask anything</h2>
    <div class="row">
      <input id="q" placeholder="가격이 얼마예요?" />
      <button id="ask">Ask</button>
    </div>
    <div class="out" id="qaOut">Type a question.</div>
  </div>

  <div class="card" style="margin-top:10px">
    <h2>Quick Facts</h2>
    <div class="kv mono">
      <div>Detected Price</div><div id="fPrice">—</div>
      <div>Expiry</div><div id="fExpiry">—</div>
      <div>Origin</div><div id="fOrigin">—</div>
      <div>Views</div><div id="fViews">0</div>
    </div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);const $$=s=>Array.from(document.querySelectorAll(s));
const state={views:[],merged:{text:'',price:null,expiry:null,origin:null}};
async function startCamera(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    $('#video').srcObject=stream;
  }catch(e){alert('Camera error: '+e.message);}
}
$('#startCam').onclick=startCamera;
async function takeFrame(){
  const v=$('#video');const c=$('#canvas');const ctx=c.getContext('2d');
  c.width=v.videoWidth;c.height=v.videoHeight;ctx.drawImage(v,0,0);
  return c.toDataURL('image/png');
}
function addThumb(url){state.views.push({dataURL:url,text:''});renderThumbs();}
function renderThumbs(){
  const b=$('#thumbs');b.innerHTML='';
  state.views.forEach((v,i)=>{
    const t=document.createElement('div');t.className='thumb';
    t.innerHTML=`<img src="${v.dataURL}"><button>×</button>`;
    t.querySelector('button').onclick=()=>{state.views.splice(i,1);renderThumbs();mergeFacts();};
    b.appendChild(t);
  });
  $('#fViews').textContent=state.views.length;
}
$('#addView').onclick=async()=>{const u=await takeFrame();if(u)addThumb(u);}
$('#fileInput').onchange=e=>{
  [...e.target.files].forEach(f=>{
    const url=URL.createObjectURL(f);const img=new Image();
    img.onload=()=>{const c=document.createElement('canvas');c.width=img.width;c.height=img.height;c.getContext('2d').drawImage(img,0,0);addThumb(c.toDataURL('image/png'));URL.revokeObjectURL(url);}
    img.src=url;
  });
};
$('#clearAll').onclick=()=>{state.views=[];renderThumbs();$('#fPrice').textContent=$('#fExpiry').textContent='—';};

function preprocess(url){return new Promise(res=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=i.width;c.height=i.height;const ctx=c.getContext('2d');ctx.filter='grayscale(1) contrast(1.6)';ctx.drawImage(i,0,0);res(c);};i.src=url;});}
function parseKRW(t){
  const hits=[];const rx=/(?:₩|￦|W)\s*([0-9]{1,3}(?:,[0-9]{3})*|[0-9]{2,6})/gi;let m;
  while((m=rx.exec(t))!==null){const n=parseInt(m[1].replace(/,/g,''));if(isFinite(n)&&n>=100&&n<=100000)hits.push(n);}
  if(!hits.length)return null;hits.sort((a,b)=>a-b);return hits[0];
}
function parseDate(t){
  const r=/(20\d{2})[.\-\/]?(0?[1-9]|1[0-2])[.\-\/]?(0?[1-9]|[12]\d|3[01])/;const m=t.match(r);
  if(!m)return null;const d=new Date(m[1],m[2]-1,m[3]);return isNaN(d)?null:d;
}
function detectOrigin(t){if(/한국|Korea/i.test(t))return'Korea';if(/미국|USA/i.test(t))return'USA';return null;}

$('#runAll').onclick=async()=>{
  if(!state.views.length){alert('Add view first');return;}
  const lang=$('#lang').value;
  for(let v of state.views){
    const c=await preprocess(v.dataURL);
    const res=await Tesseract.recognize(c,lang);
    v.text=res.data.text||'';
  }
  mergeFacts();
};
function mergeFacts(){
  const all=state.views.map(v=>v.text).join('\n');
  state.merged.text=all;
  const p=parseKRW(all.replace(/\s/g,''));const d=parseDate(all);const o=detectOrigin(all);
  $('#fPrice').textContent=p?new Intl.NumberFormat('ko-KR').format(p)+'원':'unreadable';
  $('#fExpiry').textContent=d?d.toISOString().slice(0,10):'unreadable';
  $('#fOrigin').textContent=o||'—';
}

/* local Q&A */
function detectLang(s){return/[가-힣]/.test(s)?'KR':'EN';}
function askLocal(q){
  const L=detectLang(q);const t=state.merged;
  const say=(en,kr)=>L==='KR'?kr:en;
  if(/how much|가격|얼마/.test(q))return t.price?say(`Price ${t.price}.`,`가격은 ${t.price}입니다.`):$('#fPrice').textContent;
  if(/expiry|유통기한/.test(q))return $('#fExpiry').textContent;
  return say('No info.','정보 없음');
}
$('#ask').onclick=()=>{const q=$('#q').value.trim();if(!q)return;$('#qaOut').textContent=askLocal(q);};
</script>
</body>
</html>
